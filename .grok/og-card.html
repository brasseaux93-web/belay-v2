<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BELAY</title>
    <style>
      @font-face {
        font-family: "Inter Display";
        src: url("fonts/extras/woff-hinted/InterDisplay-SemiBold.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/extras/woff-hinted/Inter-Medium.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("fonts/extras/woff-hinted/Inter-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #000000;
      }
      body {
        position: relative;
        color: #ededed;
        font-family: Inter, "Liberation Sans", sans-serif;
      }
      .field {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 70% 58% at 50% 48%, #0a0a0a 0%, #000000 72%);
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(237, 237, 237, 0.055) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(237, 237, 237, 0.055) 1px, transparent 1px);
        background-size: 40px 40px;
        background-position: -1px -1px;
        -webkit-mask-image: radial-gradient(ellipse 72% 64% at 50% 48%, #000 18%, transparent 78%);
        mask-image: radial-gradient(ellipse 72% 64% at 50% 48%, #000 18%, transparent 78%);
      }
      .tick {
        position: absolute;
        width: 18px;
        height: 18px;
        border-color: rgba(237, 237, 237, 0.22);
        border-style: solid;
      }
      .tick-tl { top: 36px; left: 36px; border-width: 1px 0 0 1px; }
      .tick-tr { top: 36px; right: 36px; border-width: 1px 1px 0 0; }
      .tick-bl { bottom: 36px; left: 36px; border-width: 0 0 1px 1px; }
      .tick-br { bottom: 36px; right: 36px; border-width: 0 1px 1px 0; }
      .lockup {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .pip {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #0070f3;
        box-shadow: 0 0 0 4px rgba(0, 112, 243, 0.16), 0 0 18px rgba(0, 112, 243, 0.55);
        margin-bottom: 36px;
      }
      h1 {
        font-family: "Inter Display", Inter, "Liberation Sans", sans-serif;
        font-weight: 600;
        font-size: 208px;
        letter-spacing: -0.075em;
        line-height: 0.86;
        color: #ededed;
      }
      .rule {
        width: 56px;
        height: 2px;
        background: #0070f3;
        margin: 34px 0 26px;
      }
      .sub {
        font-weight: 400;
        font-size: 26px;
        letter-spacing: 0.02em;
        color: rgba(237, 237, 237, 0.7);
      }
    </style>
  </head>
  <body>
    <div class="field"></div>
    <div class="grid"></div>
    <div class="tick tick-tl"></div>
    <div class="tick tick-tr"></div>
    <div class="tick tick-bl"></div>
    <div class="tick tick-br"></div>
    <div class="lockup">
      <div class="pip"></div>
      <h1>BELAY</h1>
      <div class="rule"></div>
      <p class="sub">90-minute confirmed check-in</p>
    </div>
  </body>
</html>
